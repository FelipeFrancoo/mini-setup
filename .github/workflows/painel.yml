name: Painel

# Busca GitHub + clima a cada 15 min e publica index.html + data.json no Pages.
# Requer: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Não cria commits (não polui seu gráfico de contribuições).

on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gerar data.json
        run: node scripts/build-data.mjs
        env:
          GH_USER: FelipeFrancoo
          LAT: '-17.88'
          LON: '-51.72'
          TZ_NAME: America/Sao_Paulo
          # Opcional: crie o secret GH_PAT (token só-leitura) para incluir contribuições privadas no mapa.
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
