<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Painel">
<meta name="format-detection" content="telephone=no">
<title>Painel</title>
<!--
  Painel para iPad mini 1 (iOS 9.3.5 / Safari 9) — 1024 x 768 em paisagem.
  JS em ES5 puro; CSS sem grid, sem variáveis, sem vh.
  Tudo roda no próprio iPad (relógio, calendário, Terra, timer, sol, binário),
  sem nenhuma dependência de internet (o iOS 9 não abre as APIs atuais).
-->
<style>
  * { margin: 0; padding: 0; -webkit-box-sizing: border-box; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #07080a; color: #e8eaed;
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
    -webkit-text-size-adjust: 100%;
  }
  body { position: fixed; top: 0; left: 0; right: 0; bottom: 0; }

  #stage {
    position: absolute; top: 0; left: 0;
    width: 1024px; height: 768px; overflow: hidden;
    padding: 40px 48px 36px;
    background-color: #0a0c0f;
    background-image:
      -webkit-radial-gradient(12% 18%, circle, rgba(57,211,83,0.10) 0%, rgba(57,211,83,0) 420px),
      -webkit-radial-gradient(95% 100%, circle, rgba(88,120,255,0.10) 0%, rgba(88,120,255,0) 460px);
    background-image:
      radial-gradient(circle 420px at 12% 18%, rgba(57,211,83,0.10), rgba(57,211,83,0)),
      radial-gradient(circle 460px at 95% 100%, rgba(88,120,255,0.10), rgba(88,120,255,0));
    -webkit-transform-origin: 0 0; transform-origin: 0 0;
  }

  .row { display: -webkit-flex; display: flex; }
  .col { display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }
  .grow { -webkit-flex: 1; flex: 1; min-width: 0; }
  .between { -webkit-justify-content: space-between; justify-content: space-between; }
  .center { -webkit-align-items: center; align-items: center; }

  .label {
    font-size: 13px; letter-spacing: 2.2px; text-transform: uppercase;
    color: #7d8590; font-weight: 600;
  }
  .num { font-variant-numeric: tabular-nums; -webkit-font-feature-settings: "tnum"; font-feature-settings: "tnum"; }
  .mono { font-family: Menlo, Courier, monospace; }

  /* ---------- topo ---------- */
  #top { height: 30px; }
  #status { color: #3a4048; font-size: 11px; }

  /* ---------- corpo ---------- */
  #main { height: 612px; margin-top: 14px; }

  /* esquerda */
  #left { padding-right: 44px; }
  #greet { font-size: 26px; font-weight: 300; color: #aeb5bd; margin-top: 20px; }
  #greet b { color: #fff; font-weight: 500; }
  #clockWrap { -webkit-align-items: flex-start; align-items: flex-start; margin-top: 6px; margin-left: -8px; }
  #clock {
    white-space: nowrap; -webkit-flex-shrink: 0; flex-shrink: 0;
    font-size: 188px; line-height: 1; font-weight: 100; letter-spacing: -6px; color: #fff;
  }
  #clock .colon { display: inline-block; margin: 0 2px; position: relative; top: -12px; opacity: .55; }
  #secs { font-size: 34px; font-weight: 200; color: #39d353; margin: 30px 0 0 14px; letter-spacing: 0; }
  #date { font-size: 30px; font-weight: 300; color: #d6dbe0; margin-top: 4px; }
  #date span { color: #7d8590; }
  #extra { margin-top: 18px; }
  #extra .label { margin-right: 26px; white-space: nowrap; }
  #extra .label b { color: #d6dbe0; font-weight: 600; }

  /* binário */
  #bin { -webkit-align-items: flex-end; align-items: flex-end; }
  .bgrp { margin-right: 14px; }
  .bcol { margin-right: 6px; }
  .bcol:last-child { margin-right: 0; }
  .bit { width: 14px; height: 14px; border-radius: 7px; margin-top: 6px; background: rgba(255,255,255,.07); }
  .bit.on { background: #39d353; }
  .bit.na { background: transparent; }
  #binTxt { margin-left: 18px; }
  #binTxt .v { font-size: 15px; color: #aeb5bd; margin-top: 8px; letter-spacing: 1px; }

  .bars { margin-top: 26px; }
  .barRow + .barRow { margin-top: 16px; }
  .bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; margin-top: 9px; }
  .bar i { display: block; height: 4px; border-radius: 2px; width: 0; background: #39d353;
    background-image: -webkit-linear-gradient(left, #26a641, #39d353);
    background-image: linear-gradient(to right, #26a641, #39d353); }
  .bar.year i { background: #58a6ff;
    background-image: -webkit-linear-gradient(left, #1f6feb, #58a6ff);
    background-image: linear-gradient(to right, #1f6feb, #58a6ff); }
  .barMeta { font-size: 13px; color: #aeb5bd; }

  /* direita: cartão geek */
  #card {
    width: 384px; height: 612px; padding: 24px 26px 22px;
    border-radius: 22px;
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.07);
  }
  .sep { height: 1px; background: rgba(255,255,255,.07); }

  /* abas: calendário | terra */
  #calHead { margin-bottom: 8px; height: 30px; }
  .tab { font-size: 15px; font-weight: 500; color: #545d68; padding: 0 12px; height: 30px; line-height: 30px; border-radius: 8px; }
  .tab:first-child { margin-left: -10px; }
  .tab.on { color: #fff; background: rgba(255,255,255,.07); }
  #tabRight { letter-spacing: 1.6px; }
  .pane { height: 214px; }

  /* terra */
  #terraCv { width: 214px; height: 214px; display: block; -webkit-flex-shrink: 0; flex-shrink: 0; }
  #terraInfo { padding-left: 10px; }
  #terraNome { font-size: 24px; font-weight: 500; color: #fff; line-height: 1; }
  #terraSeed { font-size: 10px; letter-spacing: 1.6px; color: #f2cc60; margin-top: 6px; }
  .tst { font-size: 12px; color: #7d8590; height: 21px; line-height: 21px; }
  .tst b { color: #e8eaed; font-weight: 500; }
  #terraNovo { width: auto; height: 34px; padding-top: 0; line-height: 32px; font-size: 13px; color: #f2cc60; }
  .cw { width: 47px; text-align: center; }
  .dow { font-size: 11px; color: #545d68; font-weight: 600; letter-spacing: 1px; height: 22px; line-height: 22px; }
  .cd { height: 32px; line-height: 32px; font-size: 15px; color: #aeb5bd; }
  .cd.out { color: #30363d; }
  .cd.we { color: #7d8590; }
  .cd.today span { display: inline-block; width: 30px; height: 30px; line-height: 30px; border-radius: 15px;
    background: #39d353; color: #07080a; font-weight: 700; }

  /* timer */
  #tmInfo { letter-spacing: 1.4px; }
  #timer.run #tmInfo { color: #aeb5bd; }
  #timer.paused #tmInfo { color: #f2cc60; }
  #timer.alarm #tmInfo { color: #39d353; }
  #tmMain { margin-top: 10px; height: 50px; }
  #tmTime { font-size: 50px; font-weight: 200; line-height: 50px; color: #3a4048; letter-spacing: -1px; }
  #timer.run #tmTime { color: #fff; }
  #timer.paused #tmTime { color: #f2cc60; }
  #timer.alarm #tmTime { color: #39d353; }
  #tmCancel { width: 42px; height: 42px; border-radius: 21px; border: 1px solid rgba(255,255,255,.16); display: none; }
  #tmCancel svg { display: block; margin: 14px; }
  #timer.run #tmCancel, #timer.paused #tmCancel { display: block; }
  .bar.tm { margin-top: 12px; }
  .bar.tm i { -webkit-transition: width 1s linear; transition: width 1s linear; }
  #timer.paused .bar.tm i { background: #f2cc60; background-image: none; }
  #tmChips { margin-top: 16px; }
  .chip { width: 50px; height: 46px; border-radius: 12px; text-align: center; padding-top: 7px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08);
    color: #d6dbe0; font-size: 18px; font-weight: 500; line-height: 1.05; }
  .chip small { display: block; font-size: 9px; letter-spacing: 1.2px; text-transform: uppercase; color: #7d8590; font-weight: 600; margin-top: 2px; }
  .chip.on { background: #39d353; border-color: #39d353; color: #07080a; }
  .chip.on small { color: rgba(7,8,10,.6); }
  #card.alarm { -webkit-animation: glow 1.4s ease-in-out infinite; animation: glow 1.4s ease-in-out infinite; }
  @-webkit-keyframes glow {
    0%, 100% { border-color: rgba(57,211,83,.25); background-color: rgba(57,211,83,.03); }
    50% { border-color: #39d353; background-color: rgba(57,211,83,.14); } }
  @keyframes glow {
    0%, 100% { border-color: rgba(57,211,83,.25); background-color: rgba(57,211,83,.03); }
    50% { border-color: #39d353; background-color: rgba(57,211,83,.14); } }

  /* sol */
  .stat { -webkit-flex: 1; flex: 1; }
  .stat + .stat { padding-left: 14px; border-left: 1px solid rgba(255,255,255,.08); margin-left: 14px; }
  .stat .v { font-size: 26px; font-weight: 300; color: #fff; line-height: 1.1; }
  .stat .k { font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; color: #7d8590; margin-top: 5px; }

  #rotate {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #0a0c0f;
    color: #aeb5bd; font-size: 22px; text-align: center; padding-top: 45%;
  }
  @media (orientation: portrait) and (max-width: 800px) { #rotate { display: block; } }

  #night { position: absolute; top: 0; left: 0; width: 1024px; height: 768px; background: #000; opacity: 0;
    pointer-events: none; -webkit-transition: opacity 2s; transition: opacity 2s; }
</style>
</head>
<body>
<div id="stage">
  <div id="top" class="row center">
    <div id="status" class="grow">v6</div>
  </div>

  <div id="main" class="row">
    <!-- ESQUERDA -->
    <div id="left" class="col grow between">
      <div>
        <div id="greet"></div>
        <div id="clockWrap" class="row">
          <div id="clock" class="num"><span id="hh">--</span><span class="colon" id="colon">:</span><span id="mm">--</span></div>
          <div id="secs" class="num">--</div>
        </div>
        <div id="date"></div>
        <div id="extra" class="row"><span class="label">Semana <b id="xWeek" class="num">--</b></span><span class="label">Dia <b id="xDay" class="num">--</b></span><span class="label"><span id="xNext">----</span> em <b id="xYear" class="num">--</b> dias</span></div>
      </div>

      <div>
        <div id="bin" class="row"></div>
        <div class="bars">
          <div class="barRow">
            <div class="row between"><span class="label">Dia</span><span id="dayPct" class="barMeta num"></span></div>
            <div class="bar"><i id="dayFill"></i></div>
          </div>
          <div class="barRow">
            <div class="row between"><span class="label">Ano</span><span id="yearPct" class="barMeta num"></span></div>
            <div class="bar year"><i id="yearFill"></i></div>
          </div>
        </div>
      </div>
    </div>

    <!-- DIREITA -->
    <div id="card" class="col between">
      <div>
        <div id="calHead" class="row between center">
          <div class="row"><div class="tab on" data-tab="cal">Calendário</div><div class="tab" data-tab="terra">Terra</div></div>
          <span class="label" id="tabRight"></span>
        </div>
        <div id="paneCal" class="pane"><div id="cal"></div></div>
        <div id="paneTerra" class="pane row" style="display:none">
          <canvas id="terraCv" width="214" height="214"></canvas>
          <div id="terraInfo" class="col between grow">
            <div><div id="terraNome">Terra</div><div id="terraSeed">SEMENTE ----</div></div>
            <div>
              <div class="tst row between"><span>Oceano</span><b class="num" id="tOcean">–</b></div>
              <div class="tst row between"><span>Terras</span><b class="num" id="tLand">–</b></div>
              <div class="tst row between"><span>Gelo</span><b class="num" id="tIce">–</b></div>
              <div class="tst row between"><span>Árvores</span><b class="num" id="tTrees">–</b></div>
            </div>
            <div class="chip" id="terraNovo">novo planeta</div>
          </div>
        </div>
      </div>

      <div class="sep"></div>
      <div id="timer" class="idle">
        <div class="row between center"><span class="label">Timer</span><span class="label" id="tmInfo">escolha um tempo</span></div>
        <div id="tmMain" class="row between center">
          <div id="tmTime" class="num">00:00</div>
          <div id="tmCancel"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 1l10 10M11 1L1 11" stroke="#aeb5bd" stroke-width="1.6" stroke-linecap="round"/></svg></div>
        </div>
        <div class="bar tm"><i id="tmFill"></i></div>
        <div id="tmChips" class="row between"></div>
      </div>

      <div class="sep"></div>
      <div class="row">
        <div class="stat"><div class="v num" id="sunRise">--:--</div><div class="k">Nascer do sol</div></div>
        <div class="stat"><div class="v num" id="sunSet">--:--</div><div class="k">Pôr do sol</div></div>
        <div class="stat"><div class="v num" id="sunLen">--</div><div class="k">Luz do dia</div></div>
      </div>

    </div>
  </div>

  <div id="night"></div>
</div>
<div id="rotate">Gire o iPad para a horizontal ↻</div>

<script>
/* =====================================================================
   CONFIGURAÇÃO
   ===================================================================== */
var CONFIG = {
  nome: 'Felipe',
  lat: -17.88, lon: -51.72,          // para nascer/pôr do sol
  timers: [3, 5, 10, 15, 25, 60],    // botões do timer, em minutos (6 cabem bem)
  alarmeDuracao: 60,                 // segundos apitando se ninguém tocar na tela
  noiteInicio: 0, noiteFim: 6, noiteOpacidade: 0.55
};
(function () {
  var n = /[?&]nome=([^&#]+)/.exec(location.search);
  if (n) CONFIG.nome = decodeURIComponent(n[1]);
})();

/* ---------------- utilidades (ES5) ---------------- */
function $(id) { return document.getElementById(id); }
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function milhar(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function hm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

var DIAS = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
var MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

/* ---------------- escala do palco (sem rolagem) ---------------- */
function fit() {
  var w = window.innerWidth, h = window.innerHeight;
  var s = Math.min(w / 1024, h / 768);
  var x = Math.round((w - 1024 * s) / 2), y = Math.round((h - 768 * s) / 2);
  var t = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
  var st = $('stage').style;
  st.webkitTransform = t; st.transform = t;
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });
document.addEventListener('touchmove', function (e) { e.preventDefault(); }, false);
fit();

/* ---------------- relógio binário (BCD) ---------------- */
var BITS = [2, 4, 3, 4, 3, 4];   // bits úteis por dígito: H H : M M : S S
(function buildBin() {
  var html = '';
  for (var g = 0; g < 3; g++) {
    html += '<div class="bgrp row">';
    for (var c = 0; c < 2; c++) {
      var idx = g * 2 + c;
      html += '<div class="bcol">';
      for (var b = 3; b >= 0; b--) {
        html += '<div class="bit' + (b >= BITS[idx] ? ' na' : '') + '" id="b' + idx + '_' + b + '"></div>';
      }
      html += '</div>';
    }
    html += '</div>';
  }
  html += '<div id="binTxt"><div class="label">Binário</div><div class="v mono" id="binHex">#------</div></div>';
  $('bin').innerHTML = html;
})();
function renderBin(h, m, s) {
  var digs = [Math.floor(h / 10), h % 10, Math.floor(m / 10), m % 10, Math.floor(s / 10), s % 10];
  for (var i = 0; i < 6; i++) {
    for (var b = 0; b < BITS[i]; b++) {
      $('b' + i + '_' + b).className = 'bit' + ((digs[i] >> b) & 1 ? ' on' : '');
    }
  }
  $('binHex').innerHTML = '#' + pad(h) + pad(m) + pad(s);
}

/* ---------------- calendário ---------------- */
var calLabel = '', aba = 'cal';
function renderCal(d) {
  var y = d.getFullYear(), mo = d.getMonth(), today = d.getDate();
  calLabel = MESES[mo] + ' ' + y;
  if (aba === 'cal') $('tabRight').innerHTML = calLabel;
  var ini = new Date(y, mo, 1).getDay();
  var nDias = new Date(y, mo + 1, 0).getDate();
  var nAnt = new Date(y, mo, 0).getDate();
  var html = '<div class="row">', dows = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];
  for (var i = 0; i < 7; i++) html += '<div class="cw dow">' + dows[i] + '</div>';
  html += '</div>';
  var cell = 0;
  for (var r = 0; r < 6; r++) {
    html += '<div class="row">';
    for (var c = 0; c < 7; c++, cell++) {
      var n = cell - ini + 1, cls = 'cw cd', txt;
      if (n < 1) { cls += ' out'; txt = nAnt + n; }
      else if (n > nDias) { cls += ' out'; txt = n - nDias; }
      else {
        txt = n;
        if (c === 0 || c === 6) cls += ' we';
        if (n === today) cls += ' today';
      }
      html += '<div class="' + cls + '"><span>' + txt + '</span></div>';
    }
    html += '</div>';
  }
  $('cal').innerHTML = html;
}

/* ---------------- som (Web Audio; precisa de um toque para liberar no iOS) ---------------- */
var AC = window.AudioContext || window.webkitAudioContext, actx = null;
function unlockAudio() {
  if (!AC) return;
  try {
    if (!actx) actx = new AC();
    var src = actx.createBufferSource();
    src.buffer = actx.createBuffer(1, 1, 22050);
    src.connect(actx.destination);
    if (src.start) src.start(0); else src.noteOn(0);
    if (actx.resume && actx.state === 'suspended') actx.resume();
  } catch (e) {}
}
function beep(freq, at, dur, vol) {
  if (!actx) return;
  try {
    var o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.linearRampToValueAtTime(vol, at + 0.015);
    g.gain.linearRampToValueAtTime(0.0001, at + dur);
    o.connect(g); g.connect(actx.destination);
    if (o.start) { o.start(at); o.stop(at + dur + 0.03); } else { o.noteOn(at); o.noteOff(at + dur + 0.03); }
  } catch (e) {}
}
function somInicio() { if (actx) beep(1319, actx.currentTime + 0.02, 0.07, 0.25); }
function somAlarme() {
  if (!actx) return;
  var t = actx.currentTime + 0.02;
  beep(988, t, 0.12, 0.6); beep(988, t + 0.18, 0.12, 0.6); beep(1319, t + 0.36, 0.24, 0.6);
}

/* ---------------- timer ---------------- */
var tm = { min: 0, total: 0, end: 0, left: 0, paused: false, alarm: false };
var alarmeLoop = null, alarmeIni = 0, nightOn = false;

(function buildChips() {
  var html = '', ts = CONFIG.timers;
  for (var i = 0; i < ts.length; i++) {
    var m = ts[i];
    html += '<div class="chip" data-min="' + m + '">' +
      (m >= 60 && m % 60 === 0 ? (m / 60) + '<small>hora' + (m > 60 ? 's' : '') + '</small>' : m + '<small>min</small>') + '</div>';
  }
  $('tmChips').innerHTML = html;
})();

function fmtTimer(ms) {
  var t = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return h ? h + ':' + pad(m) + ':' + pad(s) : pad(m) + ':' + pad(s);
}
function tmSave() {
  try { localStorage.setItem('painelTimer', JSON.stringify({ min: tm.min, total: tm.total, end: tm.end, left: tm.left, paused: tm.paused })); } catch (e) {}
}
function tmRestante() { return tm.paused ? tm.left : tm.end - new Date().getTime(); }

function tmStart(min) {
  pararAlarme();
  tm.min = min; tm.total = min * 60000; tm.end = new Date().getTime() + tm.total;
  tm.left = 0; tm.paused = false;
  tmSave(); somInicio(); tmRender();
}
function tmCancel() {
  pararAlarme();
  tm.min = 0; tm.total = 0; tm.end = 0; tm.paused = false;
  tmSave(); tmRender();
}
function tmPausa() {
  if (!tm.total || tm.alarm) return;
  if (tm.paused) { tm.end = new Date().getTime() + tm.left; tm.paused = false; }
  else { tm.left = tm.end - new Date().getTime(); tm.paused = true; }
  tmSave(); tmRender();
}
function tmDisparar() {
  tm.alarm = true; tm.min = 0; tm.total = 0; tm.end = 0;
  tmSave();
  alarmeIni = new Date().getTime();
  somAlarme();
  alarmeLoop = setInterval(function () {
    if (new Date().getTime() - alarmeIni > CONFIG.alarmeDuracao * 1000) { clearInterval(alarmeLoop); alarmeLoop = null; return; }
    somAlarme();
  }, 1500);
  tmRender();
}
function pararAlarme() {
  tm.alarm = false;
  if (alarmeLoop) { clearInterval(alarmeLoop); alarmeLoop = null; }
}

function tmRender() {
  var box = $('timer'), chips = $('tmChips').childNodes;
  for (var i = 0; i < chips.length; i++) {
    chips[i].className = 'chip' + (tm.total && +chips[i].getAttribute('data-min') === tm.min ? ' on' : '');
  }

    $('tmInfo').innerHTML = 'escolha um tempo';
  } else {
    var r = tmRestante();
    box.className = tm.paused ? 'paused' : 'run'; $('card').className = 'col between';
    $('tmTime').innerHTML = fmtTimer(r);

}
function tmTick() {
  if (tm.total && !tm.paused && !tm.alarm && tm.end - new Date().getTime() <= 0) { tmDisparar(); return; }
  if (tm.total) tmRender();
}

// toques: qualquer toque libera o som; durante o alarme, qualquer toque para
var ultimoToque = 0;
function onTap(e) {
  var agora = new Date().getTime();
  if (e.type === 'click' && agora - ultimoToque < 800) return;   // clique sintético após o toque
  if (e.type === 'touchstart') ultimoToque = agora;
  unlockAudio();
  if (tm.alarm) { pararAlarme(); tmRender(); if (e.type === 'touchstart') e.preventDefault(); return; }
  var t = e.target, box = $('timer');
  while (t && t !== document.body) {
    if (t.getAttribute && t.getAttribute('data-min')) { tmStart(+t.getAttribute('data-min')); break; }
    if (t.id === 'tmCancel') { tmCancel(); break; }
    if (t.id === 'tmTime') { tmPausa(); break; }
    if (t.getAttribute && t.getAttribute('data-tab')) { setAba(t.getAttribute('data-tab')); break; }
    if (t.id === 'terraNovo') { terraNovo(); break; }

$('stage').addEventListener('touchstart', onTap, false);
$('stage').addEventListener('click', onTap, false);

// retoma um timer que estava rodando antes de recarregar a página
(function () {
  try {
    var v = JSON.parse(localStorage.getItem('painelTimer') || 'null');
    if (v && v.total && (v.paused || v.end > new Date().getTime())) {

/* ---------------- Terra: planeta procedural em canvas 2D ----------------

var TW = 256, TH = 128, TSZ = 214, TR = 82, TCX = 107, TCY = 107;

var tTex = new Uint8Array(TW * TH * 3), tWater = new Uint8Array(TW * TH), tCloud = new Uint8Array(TW * TH);

  deep: [12, 42, 82], shallow: [45, 134, 168], sand: [217, 197, 138], grass: [111, 174, 78],
  forest: [59, 125, 66], rock: [124, 116, 104], snow: [242, 246, 251], ice: [220, 236, 247], tree: [31, 90, 54]

function terraGerar() {
  var sea = 0.5, freq = 1.5, rnd = tRng(tSeed * 7 + 1);
  var area = 0, aO = 0, aL = 0, aI = 0, arv = 0;
  for (var y = 0; y < TH; y++) {
    var lat = (0.5 - (y + 0.5) / TH) * Math.PI, cl = Math.cos(lat), sl = Math.sin(lat);
    for (var x = 0; x < TW; x++) {

      var e = (tFbm(px * freq, py * freq, pz * freq, 5) - 0.5) * 2.2 + 0.5 - sea;
      if (e < -0.12) e = -0.12;

      } else {

        else if (e < 0.07) c = rnd() < 0.08 ? (arv++, PAL.tree) : PAL.grass;
        else if (e < 0.14) c = rnd() < 0.18 ? (arv++, PAL.tree) : PAL.forest;

  $('tOcean').innerHTML = pct(aO); $('tLand').innerHTML = pct(aL); $('tIce').innerHTML = pct(aI);
  $('tTrees').innerHTML = milhar(arv);

}

// tabelas da projeção (fixas): para cada pixel do disco, linha/coluna base da textura e iluminação
var tPix, tRow, tU0, tShade, tSpec, tRimA, tEdge, tN = 0, tBg, tCtx, tImg, tPronto = false;
function terraPreparar() {
  var cv = $('terraCv');
  tCtx = cv.getContext('2d');
  tImg = tCtx.createImageData(TSZ, TSZ);
  var max = Math.ceil(Math.PI * (TR + 1) * (TR + 1)) + 8;
  tPix = new Uint32Array(max); tRow = new Uint32Array(max); tU0 = new Float32Array(max);
  tShade = new Float32Array(max); tSpec = new Float32Array(max); tRimA = new Float32Array(max); tEdge = new Float32Array(max);
  tBg = new Uint8ClampedArray(TSZ * TSZ * 4);

  var L = [-0.55, 0.5, 0.67], ll = Math.sqrt(L[0] * L[0] + L[1] * L[1] + L[2] * L[2]);
  L = [L[0] / ll, L[1] / ll, L[2] / ll];
  var Hx = L[0], Hy = L[1], Hz = L[2] + 1, hl = Math.sqrt(Hx * Hx + Hy * Hy + Hz * Hz); Hx /= hl; Hy /= hl; Hz /= hl;
  var star = tRng(99);
  for (var py = 0; py < TSZ; py++) {
    for (var px = 0; px < TSZ; px++) {
      var dx = (px + 0.5 - TCX), dy = (py + 0.5 - TCY), r = Math.sqrt(dx * dx + dy * dy), o = (py * TSZ + px) * 4;
      // fundo: brilho da atmosfera
      if (r > TR - 1) {

        if (g < 1) { var a = (1 - g) * (1 - g) * 0.5; tBg[o] = 97; tBg[o + 1] = 158; tBg[o + 2] = 255; tBg[o + 3] = a * 255; }
      }

        var u0 = (lon / (2 * Math.PI) + 1) * TW; u0 = u0 % TW;

        tSpec[tN] = sp * 255;
        tRimA[tN] = Math.pow(1 - nz, 2.6) * (0.25 + dif) * 0.75;

    var sx = Math.floor(star() * TSZ), sy = Math.floor(star() * TSZ), so = (sy * TSZ + sx) * 4;
    var ddx = sx - TCX, ddy = sy - TCY;
    if (ddx * ddx + ddy * ddy < (TR * 1.25) * (TR * 1.25)) continue;
    var b = 120 + Math.floor(star() * 110);

}

var tRot = 0, tRotC = 0, tMoon = 0.6, tDrag = null, tLast = 0, tLoop = false;
function terraDesenhar() {
  var d = tImg.data, tex = tTex, wat = tWater, cld = tCloud;
  d.set(tBg);
  var ru = tRot, rc = tRotC;
  for (var k = 0; k < tN; k++) {
    var o = tPix[k], row = tRow[k], u = tU0[k];
    var t = row + (((u + ru) | 0) & 255), c = row + (((u + rc) | 0) & 255);
    var t3 = t * 3, r = tex[t3], g = tex[t3 + 1], b = tex[t3 + 2];
    var ca = cld[c];
    if (ca) { var a = ca / 255; r += (244 - r) * a; g += (247 - g) * a; b += (252 - b) * a; }
    var s = tShade[k];
    r *= s; g *= s; b *= s;
    if (wat[t] && !ca) { var sp = tSpec[k]; r += sp; g += sp; b += sp; }
    var rim = tRimA[k];
    r += 97 * rim; g += 158 * rim; b += 255 * rim;
    var e = tEdge[k];
    if (e < 1) {
      var ba = d[o + 3] / 255;
      r = r * e + d[o] * (1 - e); g = g * e + d[o + 1] * (1 - e); b = b * e + d[o + 2] * (1 - e);
      d[o + 3] = 255 * (e + ba * (1 - e));

  }

  var mx = TCX + 96 * Math.cos(tMoon), my = TCY + 26 * Math.sin(tMoon) - 10 * Math.cos(tMoon), frente = Math.sin(tMoon) > 0;
  var ddx = mx - TCX, ddy = my - TCY;
  if (frente || ddx * ddx + ddy * ddy > (TR + 7) * (TR + 7)) {

    gr.addColorStop(0, '#e6e1d8'); gr.addColorStop(0.6, '#a9a49c'); gr.addColorStop(1, '#3d3b38');

function terraFrame(now) {
  if (aba !== 'terra') { tLoop = false; return; }
  requestAnimationFrame(terraFrame);
  if (now - tLast < 33) return;          // ~30 fps: suficiente e poupa o iPad
  var dt = tLast ? Math.min(0.1, (now - tLast) / 1000) : 0; tLast = now;
  if (!tDrag) tRot -= dt * TW / 52;        // uma volta a cada ~52 s
  tRotC -= dt * TW / 40;
  tMoon += dt * 0.3;

}
function terraIniciar() {
  if (!tPronto) {
    $('tabRight').innerHTML = 'gerando…';
    setTimeout(function () {
      terraPreparar(); terraGerar();
      if (aba === 'terra') $('tabRight').innerHTML = '↔ arraste';
      terraIniciar();
    }, 30);
    return;
  }
  if (!tLoop) { tLoop = true; tLast = 0; requestAnimationFrame(terraFrame); }
}
function terraNovo() {
  tSeed = Math.floor(Math.random() * 9999) + 1;
  try { localStorage.setItem('painelSemente', tSeed); } catch (e) {}
  terraGerar();
  if (tPronto) terraDesenhar();
}
function setAba(a) {
  aba = a === 'terra' ? 'terra' : 'cal';
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) tabs[i].className = 'tab' + (tabs[i].getAttribute('data-tab') === aba ? ' on' : '');
  $('paneCal').style.display = aba === 'cal' ? 'block' : 'none';
  $('paneTerra').style.display = aba === 'terra' ? '' : 'none';
  $('tabRight').innerHTML = aba === 'cal' ? calLabel : '↔ arraste';
  try { localStorage.setItem('painelAba', aba); } catch (e) {}
  if (aba === 'terra') terraIniciar();
}
// arrastar para girar (toque e mouse)
(function () {
  var cv = $('terraCv'), k = TW / (2 * Math.PI * TR);
  function ini(x) { tDrag = { x: x }; }
  function mov(x) { if (!tDrag) return; tRot -= (x - tDrag.x) * k; tDrag.x = x; }
  function fim() { tDrag = null; }
  cv.addEventListener('touchstart', function (e) { ini(e.touches[0].pageX); }, false);
  cv.addEventListener('touchmove', function (e) { mov(e.touches[0].pageX); e.preventDefault(); }, false);
  cv.addEventListener('touchend', fim, false);
  cv.addEventListener('touchcancel', fim, false);
  cv.addEventListener('mousedown', function (e) { ini(e.pageX); }, false);
  window.addEventListener('mousemove', function (e) { mov(e.pageX); }, false);
  window.addEventListener('mouseup', fim, false);
})();
try { var sv = +localStorage.getItem('painelSemente'); if (sv > 0) tSeed = sv; } catch (e) {}

/* ---------------- sol (algoritmo do SunCalc, local) ---------------- */
function sunTimes(date, lat, lng) {
  var rad = Math.PI / 180, dayMs = 864e5, J1970 = 2440588, J2000 = 2451545, J0 = 0.0009, e = rad * 23.4397;
  var lw = rad * -lng, phi = rad * lat;
  var d = date.getTime() / dayMs - 0.5 + J1970 - J2000;
  var n = Math.round(d - J0 - lw / (2 * Math.PI));
  var ds = J0 + lw / (2 * Math.PI) + n;
  var M = rad * (357.5291 + 0.98560028 * ds);
  var C = rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
  var L = M + C + rad * 102.9372 + Math.PI;
  var dec = Math.asin(Math.sin(e) * Math.sin(L));
  var Jnoon = J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  var h0 = -0.833 * rad;
  var w = Math.acos((Math.sin(h0) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec)));
  var a = J0 + (w + lw) / (2 * Math.PI) + n;

  var Jrise = Jnoon - (Jset - Jnoon);

  return { rise: fromJ(Jrise), set: fromJ(Jset) };
}
function renderSun(d) {
  var noon = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12);
  var t = sunTimes(noon, CONFIG.lat, CONFIG.lon);
  $('sunRise').innerHTML = hm(t.rise);
  $('sunSet').innerHTML = hm(t.set);
  var min = Math.round((t.set - t.rise) / 60000);
  $('sunLen').innerHTML = Math.floor(min / 60) + 'h' + pad(min % 60);
}

/* ---------------- relógio principal ---------------- */
var clockSize = 200;
function fitClock() {
  var c = $('clock'), avail = $('left').clientWidth - 44 - $('secs').offsetWidth - 14;
  clockSize = 200; c.style.fontSize = clockSize + 'px';
  while (c.offsetWidth > avail && clockSize > 120) { clockSize -= 4; c.style.fontSize = clockSize + 'px'; }
  c.style.letterSpacing = Math.round(-clockSize / 32) + 'px';
  $('secs').style.marginTop = Math.round(clockSize * 0.16) + 'px';
}

var lastMin = -1, lastDay = -1;
function tick() {
  var d = new Date();
  var h = d.getHours(), mi = d.getMinutes(), s = d.getSeconds();
  $('secs').innerHTML = pad(s);
  renderBin(h, mi, s);

  if (mi !== lastMin) {
    lastMin = mi;
    $('hh').innerHTML = pad(h);
    $('mm').innerHTML = pad(mi);
    $('date').innerHTML = DIAS[d.getDay()] + '<span>, </span>' + d.getDate() + ' de ' + MESES[d.getMonth()];
    fitClock();

    var y = d.getFullYear();
    var j1 = new Date(y, 0, 1), doy = Math.floor((new Date(y, d.getMonth(), d.getDate()) - j1) / 864e5) + 1;
    var th = new Date(y, d.getMonth(), d.getDate() + 3 - (d.getDay() + 6) % 7);
    var wk = 1 + Math.round(((th - new Date(th.getFullYear(), 0, 4)) / 864e5 - 3 + (new Date(th.getFullYear(), 0, 4).getDay() + 6) % 7) / 7);
    var diasAno = Math.round((new Date(y + 1, 0, 1) - j1) / 864e5);
    $('xWeek').innerHTML = wk; $('xDay').innerHTML = doy;
    $('xYear').innerHTML = diasAno - doy; $('xNext').innerHTML = y + 1;

    var saud = h < 5 ? 'Boa madrugada' : h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
    $('greet').innerHTML = saud + ', <b>' + esc(CONFIG.nome) + '</b>';

    var pctDia = (h * 60 + mi) / 1440 * 100, resta = 1440 - (h * 60 + mi);
    $('dayFill').style.width = pctDia.toFixed(1) + '%';
    $('dayPct').innerHTML = Math.floor(pctDia) + '% · faltam ' + Math.floor(resta / 60) + 'h' + pad(resta % 60);
    var pctAno = (d - j1) / (new Date(y + 1, 0, 1) - j1) * 100;
    $('yearFill').style.width = pctAno.toFixed(2) + '%';
    $('yearPct').innerHTML = pctAno.toFixed(1).replace('.', ',') + '% de ' + y;

    var noite = CONFIG.noiteInicio > CONFIG.noiteFim
      ? (h >= CONFIG.noiteInicio || h < CONFIG.noiteFim)
      : (h >= CONFIG.noiteInicio && h < CONFIG.noiteFim);
    nightOn = noite;
    aplicarNoite();

    if (d.getDate() !== lastDay) { lastDay = d.getDate(); renderCal(d); renderSun(d); }
    if (h === 4 && mi === 0 && !tm.total && !tm.alarm) setTimeout(function () { location.reload(); }, 5000);
  }
  tmTick();
}
function aplicarNoite() { $('night').style.opacity = nightOn && !tm.alarm ? CONFIG.noiteOpacidade : 0; }


/* ---------------- start ---------------- */
tmRender();
setInterval(tick, 1000);
tick();
(function () { var a = 'cal'; try { a = localStorage.getItem('painelAba') || 'cal'; } catch (e) {} setAba(a); })();
